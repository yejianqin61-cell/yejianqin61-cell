<svg xmlns="http://www.w3.org/2000/svg" width="880" height="156" viewBox="0 0 880 156" role="img" aria-label="把简单的事情做得出人意料的精彩">
  <title>把简单的事情做得出人意料的精彩</title>

  <defs>
    <!-- 光晕：把模糊结果叠加三次，堆出饱和的暖金光晕 -->
    <filter id="glow" x="-75%" y="-75%" width="250%" height="250%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
      </feMerge>
    </filter>

    <style>
      .line {
        font-family: "Noto Sans SC", "Source Han Sans SC", "PingFang SC",
                     "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei",
                     sans-serif;
        font-size: 44px;
        font-weight: 700;
        letter-spacing: 2px;
        text-anchor: middle;
      }
      .halo { fill: #ffa000; animation: breathe 4s ease-in-out infinite; }
      .core { fill: #ffe9b0; }

      @keyframes breathe {
        0%, 100% { opacity: 0.55; }
        50%      { opacity: 1; }
      }

      /* 尊重系统的"减少动态效果"设置 */
      @media (prefers-reduced-motion: reduce) {
        .halo { animation: none; opacity: 0.85; }
      }
    </style>
  </defs>

  <g filter="url(#glow)" class="halo">
    <text class="line" x="440" y="94">把简单的事情做得出人意料的精彩</text>
  </g>

  <g class="core">
    <text class="line" x="440" y="94">把简单的事情做得出人意料的精彩</text>
  </g>
</svg>
