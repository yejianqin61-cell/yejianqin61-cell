<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="人民需要什么，我会什么，我能做什么">
  <title>人民需要什么 · 我会什么 · 我能做什么</title>

  <defs>
    <!-- 光晕：白底上要克制，模糊叠加两次即可，否则会糊成一片 -->
    <filter id="glow" x="-75%" y="-75%" width="250%" height="250%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
      </feMerge>
    </filter>

    <style>
      .line {
        font-family: "Noto Sans SC", "Source Han Sans SC", "PingFang SC",
                     "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei",
                     sans-serif;
        font-size: 44px;
        font-weight: 700;
        letter-spacing: 2px;
        text-anchor: middle;
      }
      .halo { fill: #ffc107; animation: breathe 4s ease-in-out infinite; }
      .core { fill: #9a6300; }

      @keyframes breathe {
        0%, 100% { opacity: 0.45; }
        50%      { opacity: 0.95; }
      }

      /* 尊重系统的"减少动态效果"设置 */
      @media (prefers-reduced-motion: reduce) {
        .halo { animation: none; opacity: 0.75; }
      }
    </style>
  </defs>

  <g filter="url(#glow)" class="halo">
    <text class="line" x="450" y="76">人民需要什么</text>
    <text class="line" x="450" y="144">我会什么</text>
    <text class="line" x="450" y="212">我能做什么</text>
  </g>

  <g class="core">
    <text class="line" x="450" y="76">人民需要什么</text>
    <text class="line" x="450" y="144">我会什么</text>
    <text class="line" x="450" y="212">我能做什么</text>
  </g>
</svg>
